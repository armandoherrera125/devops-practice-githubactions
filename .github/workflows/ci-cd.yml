name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:ci

  build-and-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/armandoherrera125/devops-practice-githubactions:latest
            ghcr.io/armandoherrera125/devops-practice-githubactions:${{ github.sha }}

  deploy:
    needs: build-and-push
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy
        run: |
          sudo curl -LO https://dl.k8s.io/release/v1.26.0/bin/linux/amd64/kubectl && \
          sudo chmod +x ./kubectl && \
          sudo mv ./kubectl /usr/local/bin/kubectl
          kubectl apply k8s-practice
          kubectl set image deployment/app-k8s-deployment app-k8s-deployment=ghcr.io/armandoherrera125/devops-practice-githubactions:${{ github.sha }}
          kubectl rollout status deployment/app-k8s-deployment --timeout=120s
